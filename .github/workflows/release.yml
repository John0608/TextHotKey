name: Release

# v로 시작하는 태그를 푸시하면 자동으로 빌드하고 릴리스에 zip + 설치 파일을 첨부한다.
#   예) git tag v1.2.0 && git push origin v1.2.0
# workflow_dispatch로 수동 실행하면 릴리스 없이 산출물(zip/setup)만 아티팩트로 올려 확인할 수 있다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 릴리스 생성/자산 업로드에 필요

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -like 'v*') {
            $display = $ref.TrimStart('v')          # 예: 1.3.0 또는 1.3.0-beta.2
          } else {
            # 태그가 아닌 수동 실행: csproj의 <Version> 사용
            [xml]$c = Get-Content TextHotKey/TextHotKey.csproj
            $display = ($c.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          }
          # 사전 릴리스(-beta.N) 판정 + 어셈블리용 numeric 버전(X.Y.Z.N) 계산
          if ($display -match '^(\d+)\.(\d+)\.(\d+)-beta\.(\d+)$') {
            $numeric = "$($matches[1]).$($matches[2]).$($matches[3]).$($matches[4])"
            $pre = 'true'
          } elseif ($display -match '^(\d+)\.(\d+)\.(\d+)$') {
            $numeric = $display
            $pre = 'false'
          } else {
            $numeric = '0.0.0'; $pre = 'false'
          }
          "display=$display"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$numeric"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$pre"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "display=$display numeric=$numeric prerelease=$pre"

      - name: Build release package
        shell: pwsh
        run: ./build-release.ps1 -Version "${{ steps.ver.outputs.numeric }}" -DisplayVersion "${{ steps.ver.outputs.display }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TextHotKey-${{ steps.ver.outputs.display }}
          path: |
            publish/TextHotKey-win-x64.zip
            publish/TextHotKey-Setup-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        # 태그 푸시일 때만 릴리스를 만든다(수동 실행은 아티팩트 확인용).
        # -beta.N 태그는 --prerelease 로 발행되어 안정판과 분리된다.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ghArgs = @(
            "${{ github.ref_name }}",
            "publish/TextHotKey-win-x64.zip",
            "publish/TextHotKey-Setup-${{ steps.ver.outputs.display }}.exe",
            "--title", "${{ github.ref_name }}",
            "--generate-notes"
          )
          if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
